# Render blueprint for the AnalyzeIt parser/agent service.
# One-click deploy: Render Dashboard → New → Blueprint → connect this repo.
# Render reads this file, builds services/parser/Dockerfile, and provisions the
# service. Fill the sync:false secrets in the dashboard after the first deploy
# (they are intentionally NOT stored in git).
services:
  - type: web
    name: analyzit-parser
    runtime: docker
    plan: free
    rootDir: services/parser
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Reasoning provider
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: MODEL_PRIMARY
        value: z-ai/glm-5.3-flash
      - key: MODEL_SECONDARY
        value: z-ai/glm-5.3-flash
      # Shared secret the Next.js dashboard presents as `Authorization: Bearer`.
      # Set the SAME value in Vercel's HERMES_API_SECRET.
      - key: HERMES_API_SECRET
        sync: false
      # HMAC key for the controlled tool layer; must match Vercel's TOOL_LAYER_SECRET.
      - key: TOOL_LAYER_SECRET
        sync: false
      # Supabase (service-role — server-only) so the parser can fetch uploads.
      - key: SUPABASE_URL
        value: https://jweclsvkndyvltchnbcl.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false

# The analysis worker is NOT here. It runs on the Hostinger VPS, as a systemd
# unit -- see deploy/analyzit-worker.service. It needs no inbound port, no URL
# and no TLS certificate, because nothing calls it: it dials out to Supabase,
# claims jobs from `agent_jobs`, and writes results back.
#
# This file covers only the legacy chat/tool web service, which Phase 2 removes
# along with the rest of the synchronous path. When that lands, render.yaml goes
# with it and the deployment is Vercel + Supabase + Hostinger.
